<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BMU Study Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0E0E12;
  --bg2: #16161C;
  --bg3: #1E1E26;
  --border: rgba(255,255,255,0.07);
  --accent: #7B6EF6;
  --accent2: #A89CF7;
  --green: #4ADE80;
  --red: #F87171;
  --yellow: #FBBF24;
  --text: #F0EFF8;
  --text2: #8B8A9E;
  --text3: #4A4960;
  --radius: 16px;
  --radius-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; background: var(--bg); font-family: 'Sora', sans-serif; color: var(--text); }

/* LAYOUT */
.app { display: flex; flex-direction: column; height: 100vh; max-width: 430px; margin: 0 auto; position: relative; }
.main { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 0 16px 16px; scroll-behavior: smooth; }
.main::-webkit-scrollbar { display: none; }

/* HEADER */
.header { padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--bg); z-index: 10; border-bottom: 1px solid var(--border); }
.header-logo { font-size: 15px; font-weight: 600; letter-spacing: -0.3px; }
.header-logo span { color: var(--accent2); }
.header-back { display: none; align-items: center; gap: 6px; font-size: 14px; color: var(--accent2); cursor: pointer; padding: 6px 10px; border-radius: var(--radius-sm); background: rgba(123,110,246,0.1); }
.header-back.show { display: flex; }
.ava { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }

/* BOTTOM NAV */
.nav { display: flex; background: var(--bg2); border-top: 1px solid var(--border); padding: 8px 0 max(8px, env(safe-area-inset-bottom)); }
.nb { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 4px; font-size: 10px; color: var(--text3); background: none; border: none; cursor: pointer; transition: color 0.2s; }
.nb.on { color: var(--accent2); }
.nb svg { width: 20px; height: 20px; }

/* SCREENS */
.sc { display: none; animation: fadeIn 0.2s ease; }
.sc.on { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* HERO */
.hero { background: linear-gradient(135deg, #1A1730, #0E1530); border: 1px solid rgba(123,110,246,0.2); border-radius: var(--radius); padding: 20px; margin: 16px 0 12px; position: relative; overflow: hidden; }
.hero::before { content: ''; position: absolute; top: -40px; right: -40px; width: 120px; height: 120px; background: radial-gradient(circle, rgba(123,110,246,0.3), transparent 70%); }
.hero-greeting { font-size: 12px; color: var(--accent2); font-weight: 500; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.8px; }
.hero-name { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
.hero-sub { font-size: 13px; color: var(--text2); }

/* STATS GRID */
.stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 16px; }
.stat { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; }
.stat-label { font-size: 11px; color: var(--text2); margin-bottom: 6px; }
.stat-value { font-size: 24px; font-weight: 700; letter-spacing: -1px; font-family: 'JetBrains Mono', monospace; }
.stat-value.green { color: var(--green); }
.stat-value.purple { color: var(--accent2); }

/* SECTION */
.sec-title { font-size: 11px; font-weight: 600; color: var(--text3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }

/* SUBJECT CARDS */
.scard { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
.scard:hover, .scard:active { border-color: rgba(123,110,246,0.4); background: var(--bg3); }
.sico { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.sinfo { flex: 1; min-width: 0; }
.sname { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.smeta { font-size: 11px; color: var(--text2); margin-top: 3px; }
.sbadge { font-size: 10px; font-weight: 600; padding: 4px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
.b-ok { background: rgba(74,222,128,0.15); color: var(--green); }
.b-lo { background: rgba(139,138,158,0.15); color: var(--text2); }
.b-tr { background: rgba(123,110,246,0.2); color: var(--accent2); }

/* BUTTONS */
.btn { width: 100%; padding: 14px; border: none; border-radius: var(--radius-sm); font-size: 14px; font-weight: 600; font-family: 'Sora', sans-serif; cursor: pointer; transition: opacity 0.15s, transform 0.1s; }
.btn:active { transform: scale(0.98); }
.btn-p { background: var(--accent); color: #fff; }
.btn-s { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
.btn + .btn { margin-top: 8px; }

/* SUBJECT MENU */
.smenu-header { background: linear-gradient(135deg, #1A1730, #0E1530); border: 1px solid rgba(123,110,246,0.2); border-radius: var(--radius); padding: 20px; margin: 16px 0 16px; }
.smenu-icon { font-size: 32px; margin-bottom: 10px; }
.smenu-name { font-size: 18px; font-weight: 700; letter-spacing: -0.5px; }
.smenu-meta { font-size: 12px; color: var(--text2); margin-top: 4px; }
.mode-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all 0.2s; }
.mode-card:active { transform: scale(0.98); border-color: var(--accent); }
.mode-ico { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
.mode-info { flex: 1; }
.mode-title { font-size: 14px; font-weight: 600; }
.mode-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }
.mode-arrow { color: var(--text3); font-size: 18px; }

/* QUIZ */
.qprog { display: flex; align-items: center; gap: 10px; margin: 16px 0 14px; }
.qprog-bar { flex: 1; height: 4px; background: var(--bg3); border-radius: 2px; overflow: hidden; }
.qprog-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s cubic-bezier(.4,0,.2,1); }
.qprog-text { font-size: 11px; color: var(--text2); font-family: 'JetBrains Mono', monospace; white-space: nowrap; }
.qcard { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
.qtext { font-size: 15px; font-weight: 500; line-height: 1.6; color: var(--text); }
.qopt { padding: 14px 16px; border: 1px solid var(--border); border-radius: var(--radius-sm); margin-top: 10px; font-size: 13px; cursor: pointer; transition: all 0.15s; color: var(--text); background: var(--bg3); }
.qopt:hover { border-color: var(--accent); background: rgba(123,110,246,0.1); }
.qopt.ok { border-color: var(--green); background: rgba(74,222,128,0.1); color: var(--green); }
.qopt.no { border-color: var(--red); background: rgba(248,113,113,0.1); color: var(--red); }
.qopt.disabled { pointer-events: none; }
.qexpl { background: var(--bg3); border-left: 3px solid var(--accent); border-radius: var(--radius-sm); padding: 12px 14px; margin-top: 12px; font-size: 12px; color: var(--text2); line-height: 1.6; display: none; }
.qnext { margin-top: 12px; }

/* RESULT */
.result-hero { text-align: center; padding: 32px 20px; }
.result-score { font-size: 72px; font-weight: 700; font-family: 'JetBrains Mono', monospace; letter-spacing: -3px; background: linear-gradient(135deg, var(--accent2), var(--green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.result-label { font-size: 14px; color: var(--text2); margin-top: 4px; }
.result-grade { font-size: 16px; font-weight: 600; margin-top: 16px; }

/* FLASHCARDS */
.fc-counter { text-align: center; font-size: 12px; color: var(--text2); margin: 16px 0 10px; font-family: 'JetBrains Mono', monospace; }
.fc-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 28px 20px; min-height: 200px; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; margin-bottom: 14px; cursor: pointer; transition: border-color 0.2s; position: relative; overflow: hidden; }
.fc-card:active { border-color: var(--accent); }
.fc-side { font-size: 10px; color: var(--accent2); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 14px; }
.fc-term { font-size: 18px; font-weight: 700; color: var(--text); line-height: 1.4; }
.fc-def { font-size: 13px; color: var(--text2); line-height: 1.7; display: none; }
.fc-hint { font-size: 11px; color: var(--text3); margin-top: 12px; }
.fc-nav { display: flex; gap: 10px; }
.fc-nav .btn { flex: 1; }
.fc-progress-dots { display: flex; justify-content: center; gap: 5px; margin-bottom: 12px; flex-wrap: wrap; }
.dot { width: 6px; height: 6px; border-radius: 3px; background: var(--bg3); transition: background 0.2s; }
.dot.done { background: var(--accent); }
.dot.current { background: var(--accent2); width: 16px; }

/* NOTES */
.chapter { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
.chapter-hdr { padding: 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.chapter-title { font-size: 13px; font-weight: 600; }
.chapter-arrow { color: var(--text3); transition: transform 0.2s; }
.chapter.open .chapter-arrow { transform: rotate(90deg); }
.chapter-body { padding: 0 16px 16px; font-size: 12px; color: var(--text2); line-height: 1.8; display: none; }
.chapter.open .chapter-body { display: block; }
.chapter-body strong { color: var(--text); font-weight: 600; }

/* PROGRESS */
.prog-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 8px; }
.prog-subject { font-size: 13px; font-weight: 600; margin-bottom: 10px; }
.prog-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.prog-label { font-size: 11px; color: var(--text2); }
.prog-val { font-size: 13px; font-weight: 600; font-family: 'JetBrains Mono', monospace; color: var(--accent2); }
.prog-bar { height: 4px; background: var(--bg3); border-radius: 2px; margin-top: 8px; overflow: hidden; }
.prog-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--accent), var(--accent2)); transition: width 0.8s cubic-bezier(.4,0,.2,1); }
.streak-card { background: linear-gradient(135deg, rgba(251,191,36,0.15), rgba(251,191,36,0.05)); border: 1px solid rgba(251,191,36,0.2); border-radius: var(--radius); padding: 16px; display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.streak-num { font-size: 36px; font-weight: 700; color: var(--yellow); font-family: 'JetBrains Mono', monospace; }
.streak-info { }
.streak-title { font-size: 14px; font-weight: 600; color: var(--yellow); }
.streak-sub { font-size: 12px; color: var(--text2); margin-top: 2px; }

/* ACHIEVEMENTS */
.ach { display: flex; align-items: center; gap: 12px; background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 8px; }
.ach.locked { opacity: 0.4; }
.ach-ico { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.ach-name { font-size: 13px; font-weight: 600; }
.ach-desc { font-size: 11px; color: var(--text2); margin-top: 2px; }

/* PROFILE */
.profile-hero { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin: 16px 0 12px; display: flex; align-items: center; gap: 14px; }
.profile-ava { width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent2)); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; flex-shrink: 0; }
.profile-name { font-size: 16px; font-weight: 700; letter-spacing: -0.3px; }
.profile-meta { font-size: 12px; color: var(--text2); margin-top: 4px; }
.prow { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 15px 16px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
.prow-l { font-size: 13px; font-weight: 500; }
.prow-r { font-size: 13px; color: var(--text2); }

/* BUY */
.buy-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 8px; }
.buy-card.selected { border-color: var(--accent); background: rgba(123,110,246,0.05); }
.buy-subject { font-size: 14px; font-weight: 600; }
.buy-price { font-size: 13px; color: var(--accent2); font-family: 'JetBrains Mono', monospace; margin-top: 4px; }
.promo-input { width: 100%; padding: 14px 16px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: 'Sora', sans-serif; color: var(--text); outline: none; margin-bottom: 10px; }
.promo-input:focus { border-color: var(--accent); }
.promo-input::placeholder { color: var(--text3); }
.toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px 20px; font-size: 13px; font-weight: 500; z-index: 100; white-space: nowrap; animation: slideUp 0.3s ease; }
@keyframes slideUp { from { opacity: 0; transform: translateX(-50%) translateY(10px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

.loader { display: flex; justify-content: center; align-items: center; padding: 40px; }
.loader-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin: 0 4px; animation: bounce 0.6s infinite alternate; }
.loader-dot:nth-child(2) { animation-delay: 0.2s; }
.loader-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { from { transform: translateY(0); opacity: 0.4; } to { transform: translateY(-8px); opacity: 1; } }

.empty { text-align: center; padding: 40px 20px; color: var(--text2); font-size: 14px; }
.empty-ico { font-size: 40px; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="header-back" id="backBtn" onclick="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      Back
    </div>
    <div class="header-logo" id="headerTitle">BMU <span>Study Hub</span></div>
    <div class="ava" id="userAva">?</div>
  </div>

  <div class="main" id="mainContent">
    <div class="loader"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>
  </div>

  <nav class="nav">
    <button class="nb on" id="tab-home" onclick="showTab('home')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Home
    </button>
    <button class="nb" id="tab-progress" onclick="showTab('progress')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      Progress
    </button>
    <button class="nb" id="tab-profile" onclick="showTab('profile')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Profile
    </button>
  </nav>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.expand();
tg.setHeaderColor('#0E0E12');
tg.setBackgroundColor('#0E0E12');

// Replace with your Railway URL
const API_URL = 'YOUR_RAILWAY_URL_HERE';

let state = {
  user: null,
  subjects: [],
  currentSubject: null,
  quizQuestions: [],
  quizIndex: 0,
  quizScore: 0,
  quizAnswered: false,
  isTrial: false,
  fcCards: [],
  fcIndex: 0,
  fcFlipped: false,
  navStack: ['home'],
  activeTab: 'home',
  progress: {},
  promoDiscount: 0,
  selectedBuySubject: null,
};

function initData() {
  return tg.initData || '';
}

async function api(path, method='GET', body=null) {
  const opts = {
    method,
    headers: { 'x-init-data': initData(), 'Content-Type': 'application/json' }
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(API_URL + path, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

function render(html) {
  document.getElementById('mainContent').innerHTML = html;
}

function loader() {
  render('<div class="loader"><div class="loader-dot"></div><div class="loader-dot"></div><div class="loader-dot"></div></div>');
}

function toast(msg, color='') {
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  if (color) el.style.color = color;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2500);
}

function subjectIcon(key) {
  const icons = { f1: '📊', f3: '💰', fm: '🏛️', macro: '🌍' };
  return icons[key] || '📚';
}

function subjectBg(key) {
  const bgs = { f1: 'rgba(74,222,128,0.15)', f3: 'rgba(123,110,246,0.15)', fm: 'rgba(96,165,250,0.15)', macro: 'rgba(251,191,36,0.15)' };
  return bgs[key] || 'rgba(139,138,158,0.15)';
}

// ── HOME ──────────────────────────────────────────────────────────────────────

async function showHome() {
  document.getElementById('headerTitle').innerHTML = 'BMU <span>Study Hub</span>';
  document.getElementById('backBtn').classList.remove('show');
  setActiveTab('home');

  if (!state.user) {
    loader();
    try {
      state.user = await api('/api/me');
      state.subjects = await api('/api/subjects');
      document.getElementById('userAva').textContent = (state.user.first_name || '?')[0].toUpperCase();
    } catch(e) {
      render('<div class="empty"><div class="empty-ico">⚠️</div>Failed to load. Please restart the app.</div>');
      return;
    }
  }

  const unlocked = state.subjects.filter(s => s.unlocked);
  const locked = state.subjects.filter(s => !s.unlocked);

  render(`
    <div class="hero">
      <div class="hero-greeting">Welcome back</div>
      <div class="hero-name">${state.user.first_name || 'Student'} 👋</div>
      <div class="hero-sub">${unlocked.length} subject${unlocked.length !== 1 ? 's' : ''} unlocked · Keep studying!</div>
    </div>

    ${state.subjects.length > 0 ? `
    <div class="stats">
      <div class="stat">
        <div class="stat-label">Unlocked</div>
        <div class="stat-value purple">${unlocked.length}/${state.subjects.length}</div>
      </div>
      <div class="stat">
        <div class="stat-label">Available</div>
        <div class="stat-value green">${locked.length}</div>
      </div>
    </div>` : ''}

    ${unlocked.length > 0 ? `
    <div class="sec-title">My Subjects</div>
    ${unlocked.map(s => `
      <div class="scard" onclick="showSubjectMenu('${s.key}')">
        <div class="sico" style="background:${subjectBg(s.key)}">${subjectIcon(s.key)}</div>
        <div class="sinfo">
          <div class="sname">${s.name}</div>
          <div class="smeta">Notes · Flashcards · 20 MCQ</div>
        </div>
        <span class="sbadge b-ok">Open</span>
      </div>
    `).join('')}` : ''}

    ${locked.length > 0 ? `
    <div class="sec-title" style="margin-top:${unlocked.length?'8px':'0'}">Available to unlock</div>
    ${locked.map(s => `
      <div class="scard" onclick="showBuy('${s.key}')">
        <div class="sico" style="background:${subjectBg(s.key)}">${subjectIcon(s.key)}</div>
        <div class="sinfo">
          <div class="sname">${s.name}</div>
          <div class="smeta">${(s.price||50000).toLocaleString()} UZS · 3 free questions</div>
        </div>
        <span class="sbadge b-tr">Trial</span>
      </div>
    `).join('')}` : ''}
  `);
}

// ── SUBJECT MENU ──────────────────────────────────────────────────────────────

function showSubjectMenu(key) {
  state.currentSubject = key;
  const subj = state.subjects.find(s => s.key === key);
  if (!subj) return;

  pushNav('subject');
  document.getElementById('headerTitle').innerHTML = subj.name.split('—')[0].trim();
  document.getElementById('backBtn').classList.add('show');

  render(`
    <div class="smenu-header">
      <div class="smenu-icon">${subjectIcon(key)}</div>
      <div class="smenu-name">${subj.name}</div>
      <div class="smenu-meta">Full access · All materials included</div>
    </div>

    <div class="mode-card" onclick="showNotes('${key}')">
      <div class="mode-ico" style="background:rgba(96,165,250,0.15)">📖</div>
      <div class="mode-info">
        <div class="mode-title">Study Notes</div>
        <div class="mode-sub">Key concepts and summaries</div>
      </div>
      <div class="mode-arrow">›</div>
    </div>

    <div class="mode-card" onclick="showFlashcards('${key}')">

// ── NOTES ─────────────────────────────────────────────────────────────────────

// ── FLASHCARDS ────────────────────────────────────────────────────────────────

async function showFlashcards(key) {
  pushNav('flashcards');
  document.getElementById('headerTitle').innerHTML = 'Flashcards';
  document.getElementById('backBtn').classList.add('show');
  loader();

  try {
    state.fcCards = await api(`/api/subjects/${key}/flashcards`);
    state.fcIndex = 0;
    state.fcFlipped = false;
    renderFlashcard();
  } catch(e) {
    render('<div class="empty"><div class="empty-ico">⚠️</div>Failed to load flashcards.</div>');
  }
}

function renderFlashcard() {
  const cards = state.fcCards;
  const i = state.fcIndex;
  const card = cards[i];
  const flipped = state.fcFlipped;

  const dots = cards.map((_, idx) => `
    <div class="dot ${idx < i ? 'done' : idx === i ? 'current' : ''}"></div>
  `).join('');

  render(`
    <div class="fc-progress-dots">${dots}</div>
    <div class="fc-counter">${i+1} / ${cards.length}</div>

    <div class="fc-card" onclick="flipFC()">
      <div class="fc-side">${flipped ? 'Definition' : 'Term'}</div>
      ${flipped
        ? `<div class="fc-def">${card.definition}</div>`
        : `<div class="fc-term">${card.term}</div><div class="fc-hint">Tap to reveal</div>`
      }
    </div>

    <div class="fc-nav">
      ${i > 0 ? `<button class="btn btn-s" onclick="fcPrev()">← Prev</button>` : '<div style="flex:1"></div>'}
      ${i < cards.length - 1
        ? `<button class="btn btn-p" onclick="fcNext()">Next →</button>`
        : `<button class="btn btn-p" onclick="goBack()">✅ Done</button>`
      }
    </div>
  `);
}

function flipFC() {
  state.fcFlipped = !state.fcFlipped;
  renderFlashcard();
}
function fcNext() { state.fcIndex++; state.fcFlipped = false; renderFlashcard(); }
function fcPrev() { state.fcIndex--; state.fcFlipped = false; renderFlashcard(); }

// ── QUIZ ──────────────────────────────────────────────────────────────────────

async function startQuiz(key, trial=false) {
  pushNav('quiz');
  document.getElementById('headerTitle').innerHTML = trial ? '🎯 Free Trial' : '✏️ Practice Test';
  document.getElementById('backBtn').classList.add('show');
  loader();

  try {
    const url = `/api/subjects/${key}/quiz${trial ? '?trial=true' : ''}`;
    state.quizQuestions = await api(url);
    state.quizIndex = 0;
    state.quizScore = 0;
    state.quizAnswered = false;
    state.isTrial = trial;
    state.currentSubject = key;
    renderQuestion();
  } catch(e) {
    render('<div class="empty"><div class="empty-ico">⚠️</div>Failed to load quiz.</div>');
  }
}

function renderQuestion() {
  const qs = state.quizQuestions;
  const i = state.quizIndex;
  const q = qs[i];
  const total = qs.length;
  const pct = Math.round((i / total) * 100);

  render(`
    <div class="qprog">
      <div class="qprog-bar"><div class="qprog-fill" style="width:${pct}%"></div></div>
      <div class="qprog-text">${i+1}/${total}</div>
    </div>
    <div class="qcard">
      <div class="qtext">${q.question}</div>
    </div>
    ${q.options.map((opt, idx) => `
      <div class="qopt" id="opt${idx}" onclick="pickAnswer(${idx})">${opt}</div>
    `).join('')}
    <div class="qexpl" id="qexpl">${q.explanation || ''}</div>
    <div class="qnext" id="qnext" style="display:none">
      <button class="btn btn-p" onclick="nextQuestion()">Next Question →</button>
    </div>
  `);
}

function pickAnswer(idx) {
  if (state.quizAnswered) return;
  state.quizAnswered = true;

  const q = state.quizQuestions[state.quizIndex];
  const correct = q.correct;
  const isRight = idx === correct;
  if (isRight) state.quizScore++;

  document.querySelectorAll('.qopt').forEach((el, i) => {
    el.classList.add('disabled');
    if (i === correct) el.classList.add('ok');
    else if (i === idx && !isRight) el.classList.add('no');
  });

  const expl = document.getElementById('qexpl');
  if (expl && q.explanation) expl.style.display = 'block';

  const nxt = document.getElementById('qnext');
  if (nxt) nxt.style.display = 'block';
}

async function nextQuestion() {
  state.quizIndex++;
  state.quizAnswered = false;

  if (state.quizIndex >= state.quizQuestions.length) {
    showResult();
    return;
  }
  renderQuestion();
}

async function showResult() {
  const score = state.quizScore;
  const total = state.quizQuestions.length;
  const pct = Math.round(score / total * 100);
  const key = state.currentSubject;

  if (!state.isTrial) {
    try { await api('/api/quiz/result', 'POST', { subject_key: key, score, total }); } catch(e) {}
  }

  let grade, gradeColor;
  if (pct >= 90) { grade = '🌟 Excellent! Exam ready!'; gradeColor = 'var(--green)'; }
  else if (pct >= 70) { grade = '👍 Good result! Review weak areas.'; gradeColor = 'var(--accent2)'; }
  else if (pct >= 50) { grade = '📚 Not bad, keep studying.'; gradeColor = 'var(--yellow)'; }
  else { grade = '💪 Keep going! Study more and retry.'; gradeColor = 'var(--red)'; }

  render(`
    <div class="result-hero">
      <div class="result-score">${pct}%</div>
      <div class="result-label">${score} correct out of ${total}</div>
      <div class="result-grade" style="color:${gradeColor}">${grade}</div>
    </div>

    ${state.isTrial ? `
      <div style="background:rgba(123,110,246,0.1);border:1px solid rgba(123,110,246,0.3);border-radius:var(--radius);padding:16px;margin-bottom:12px;text-align:center">
        <div style="font-size:14px;font-weight:600;margin-bottom:8px">Like what you see?</div>
        <div style="font-size:12px;color:var(--text2);margin-bottom:14px">Get full access: 20 MCQ · Study Notes · Flashcards · Progress tracking</div>
        <button class="btn btn-p" onclick="showBuy('${key}')">🛒 Buy Full Access</button>
      </div>
    ` : `
      <button class="btn btn-p" onclick="startQuiz('${key}', false)">🔄 Try Again</button>
      <button class="btn btn-s" style="margin-top:8px" onclick="goBack()">← Back to Subject</button>
    `}
  `);
}

// ── BUY ───────────────────────────────────────────────────────────────────────

function showBuyAll() {
  showBuy(null);
}

function showBuy(preselect) {
  pushNav('buy');
  document.getElementById('headerTitle').innerHTML = 'Buy <span>Access</span>';
  document.getElementById('backBtn').classList.add('show');

  state.promoDiscount = 0;
  state.selectedBuySubject = preselect;
  renderBuyScreen();
}

function renderBuyScreen() {
  const locked = state.subjects.filter(s => !s.unlocked);
  if (locked.length === 0) {
    render('<div class="empty" style="margin-top:60px"><div class="empty-ico">✅</div><div>You have access to all subjects!</div></div>');
    return;
  }

  const discount = state.promoDiscount;

  render(`
    <div style="margin-top:16px">
      <div class="sec-title">Choose a subject</div>
      ${locked.map(s => {
        const price = Math.round((s.price||50000) * (1 - discount/100));
        const selected = state.selectedBuySubject === s.key;
        return `
          <div class="buy-card ${selected ? 'selected' : ''}" onclick="selectBuySubject('${s.key}')">
            <div style="display:flex;align-items:center;gap:10px">
              <span style="font-size:20px">${subjectIcon(s.key)}</span>
              <div>
                <div class="buy-subject">${s.name}</div>
                <div class="buy-price">${discount > 0 ? `<span style="text-decoration:line-through;color:var(--text3);font-size:11px">${(s.price||50000).toLocaleString()}</span> ` : ''}${price.toLocaleString()} UZS${discount > 0 ? ` <span style="color:var(--green);font-size:11px">-${discount}%</span>` : ''}</div>
              </div>
            </div>
          </div>
        `;
      }).join('')}

      <div class="sec-title" style="margin-top:12px">Promo code</div>
      <input class="promo-input" id="promoInput" placeholder="Enter code (e.g. FRIEND50)" oninput="this.value=this.value.toUpperCase()">
      <button class="btn btn-s" onclick="applyPromo()">Apply promo code</button>

      <div style="margin-top:16px">
        <button class="btn btn-p" onclick="proceedToPay()">Continue to payment →</button>
      </div>

      <div style="margin-top:16px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px">
        <div style="font-size:12px;font-weight:600;margin-bottom:8px">How to pay:</div>
        <div style="font-size:12px;color:var(--text2);line-height:1.8">
          1. Select a subject above<br>
          2. Transfer the amount to card<br>
          3. Take a screenshot of the transfer<br>
          4. Send the screenshot to the bot<br>
          5. Access granted within 30 minutes ✅
        </div>
      </div>
    </div>
  `);
}

function selectBuySubject(key) {
  state.selectedBuySubject = key;
  renderBuyScreen();
}

async function applyPromo() {
  const code = document.getElementById('promoInput')?.value?.trim();
  if (!code) { toast('Enter a promo code first'); return; }
  try {
    const res = await api('/api/promo/check', 'POST', { code });
    state.promoDiscount = res.discount;
    toast(`✅ Promo applied! ${res.discount}% discount`, 'var(--green)');
    renderBuyScreen();
  } catch(e) {
    toast('❌ Invalid promo code', 'var(--red)');
  }
}

function proceedToPay() {
  if (!state.selectedBuySubject) {
    toast('Please select a subject first');
    return;
  }
  const subj = state.subjects.find(s => s.key === state.selectedBuySubject);
  const discount = state.promoDiscount;
  const price = Math.round((subj.price||50000) * (1 - discount/100));

  tg.showAlert(`To unlock "${subj.name}":\n\nTransfer ${price.toLocaleString()} UZS to the card, then send a screenshot to the bot.\n\nOpen the bot chat to send your payment screenshot.`);
}

function showPromoOnly() {
  showBuy(null);
}

// ── NAVIGATION ────────────────────────────────────────────────────────────────

function pushNav(screen) {
  state.navStack.push(screen);
}

function goBack() {
  if (state.navStack.length > 1) {
    state.navStack.pop();
    const prev = state.navStack[state.navStack.length - 1];
    if (prev === 'home') showHome();
    else if (prev === 'subject') showSubjectMenu(state.currentSubject);
    else if (prev === 'notes') showNotes(state.currentSubject);
    else if (prev === 'flashcards') showFlashcards(state.currentSubject);
    else if (prev === 'quiz') startQuiz(state.currentSubject, state.isTrial);
    else if (prev === 'buy') showBuy(state.selectedBuySubject);
    else if (prev === 'progress') showTab_progress();
    else showHome();
  } else {
    showHome();
  }
}

function setActiveTab(tab) {
  state.activeTab = tab;
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('on'));
  const el = document.getElementById('tab-'+tab);
  if (el) el.classList.add('on');
}

function showTab(tab) {
  state.navStack = [tab];
  if (tab === 'home') showHome();
  else if (tab === 'progress') showTab_progress();
  else if (tab === 'profile') showTab_profile();
}

// ── INIT ──────────────────────────────────────────────────────────────────────

tg.onEvent('backButtonClicked', goBack);
showHome();
</script>
