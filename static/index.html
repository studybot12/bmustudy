<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Hub BMU</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0A192F; color: white; -webkit-user-select: none; }
        .card { background-color: #112240; border: 1px solid #233554; }
        .accent { color: #64FFDA; }
    </style>
</head>
<body>
    <div id="app" class="p-4">
        <h1 class="text-2xl font-bold mb-6">Study Hub <span class="accent">BMU</span></h1>
        <div v-for="(info, key) in subjects" :key="key" class="card p-5 rounded-2xl mb-4 shadow-lg">
            <h3 class="text-xl font-bold mb-2">{{ info.name }}</h3>
            <button @click="tg.close()" class="w-full py-3 bg-[#64FFDA] text-[#0A192F] rounded-xl font-bold">
                Перейти в бот
            </button>
        </div>
        <p class="text-center text-gray-500 text-sm mt-10">Весь учебный план теперь в одном окне</p>
    </div>
    <script>
        const tg = window.Telegram.WebApp;
        Vue.createApp({
            data() { return { subjects: { "f1": {"name": "F1 — Business & Tech"}, "f3": {"name": "F3 — Financial Accounting"}, "fm": {"name": "Financial Markets"}, "macro": {"name": "Macroeconomics"} } } },
            mounted() { tg.expand(); tg.ready(); }
        }).mount('#app')
    </script>
</body>
</html>
